[main]
font=Monaco Nerd Font Mono:size=11
dpi-aware=no
term=xterm-256color
selection-target=clipboard

[security]
# Allow applications like OpenCode to write to the system clipboard
osc52=enabled

[cursor]
style=block

[colors]
cursor=ffffff bb2222
background=000000
alpha=0.9

[key-bindings]
clipboard-paste=Mod4+v
clipboard-copy=Mod4+c
